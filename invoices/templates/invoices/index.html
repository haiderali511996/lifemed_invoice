{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <title>LifeMed Pharma - Invoice System</title>

    <link rel="icon" href="{% static 'invoices/favicon-32.png' %}" sizes="32x32" />
    <link rel="icon" href="{% static 'invoices/favicon-64.png' %}" sizes="64x64" />
    <link rel="apple-touch-icon" href="{% static 'invoices/apple-touch-icon.png' %}" />

    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f8f9fa;
        padding: 30px;
      }

      .container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        max-width: 1100px;
        margin: auto;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }

      h2 {
        margin-bottom: 20px;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand h2 {
        margin: 0;
        padding-left: 14px;
        border-left: 3px solid #0065ad;
        font-size: 20px;
        color: #14304d;
      }

      .brand-logo {
        height: 46px;
        width: auto;
      }

      /* 📋 Logs aur Logout buttons ka container */
      .top-bar-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .btn-logs {
        text-decoration: none;
        color: white;
        background: #007bff;
        padding: 8px 15px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: bold;
        transition: background 0.2s;
      }

      .btn-logs:hover {
        background: #0056b3;
      }

      .logout {
        text-decoration: none;
        color: white;
        background: #dc3545;
        padding: 8px 15px;
        border-radius: 6px;
      }

      .prefill-note {
        min-height: 18px;
        margin: -8px 0 12px;
        font-size: 13px;
        color: #0056b3;
      }

      .header-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 20px;
      }

      label {
        font-weight: bold;
        font-size: 14px;
      }

      input,
      select,
      textarea {
        padding: 10px;
        border: 1px solid #ced4da;
        border-radius: 6px;
        width: 100%;
      }

      textarea {
        height: 70px;
        resize: none;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }

      th {
        background: #343a40;
        color: white;
        padding: 10px;
      }

      td {
        padding: 8px;
      }

      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      .add-btn {
        background: #28a745;
        color: white;
        margin-top: 10px;
      }

      .generate-btn {
        background: #007bff;
        color: white;
        width: 100%;
        margin-top: 20px;
        font-size: 16px;
      }

      .delete-btn {
        background: #dc3545;
        color: white;
      }

      select option {
        padding: 8px;
      }

      /* 🚫 CUSTOM ACCESSIBLE WARNING NOTIFICATION STYLE */
      .custom-alert {
        background-color: #f8d7da;
        color: #842029;
        border: 1px solid #f5c2c7;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 20px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        animation: fadeIn 0.3s ease-in-out;
      }

      .custom-alert .close-alert-btn {
        background: none;
        border: none;
        color: #842029;
        font-size: 18px;
        cursor: pointer;
        font-weight: bold;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- DJANGO MESSAGES FRAMEWORK DISPLAYER FOR MANAGER REDIRECT WARNINGS -->
      {% if messages %}
      <div id="django-custom-messages">
        {% for message in messages %}
        <div class="custom-alert">
          <span>{{ message }}</span>
          <button class="close-alert-btn" onclick="this.parentElement.remove()">
            ×
          </button>
        </div>
        {% endfor %}
      </div>
      {% endif %}

      <div class="top-bar">
        <div class="brand">
          <img
            src="{% static 'invoices/lifemed-logo.png' %}"
            alt="LifeMed Pharma"
            class="brand-logo"
          />
          <h2>Invoice Form</h2>
        </div>
        <div class="top-bar-actions">
          <a href="{% url 'customer_list' %}" class="btn-logs">👥 Customers</a>
          <a href="{% url 'invoice_logs' %}" class="btn-logs"
            >📋 View Activity Logs</a
          >
          <a href="/logout/" class="logout">Logout</a>
        </div>
      </div>

      <form method="POST" action="{% url 'generate' %}">
        {% csrf_token %}

        <label>Select Customer</label>
        <select id="customerDropdown" onchange="fillCustomer()">
          <option value="">-- Search & Select Customer --</option>
          {% for c in customers %}
          <option
            value="{{ c.id }}"
            data-name="{{ c.name }}"
            data-ntn="{{ c.ntn }}"
            data-sale="{{ c.sales_tax }}"
            data-address="{{ c.address }}"
            data-license="{{ c.license_no }}"
          >
            {{ c.name }}
          </option>
          {% endfor %}
        </select>

        <div id="prefill-note" class="prefill-note"></div>

        <div class="header-grid">
          <div>
            <label>Customer Name</label>
            <input type="text" name="customer_name" id="customer_name" />
          </div>

          <div>
            <label>License #</label>
            <input type="text" name="license_no" id="license_no" />
          </div>

          <div>
            <label>CNIC/NTN #</label>
            <input type="text" name="ntn" id="ntn" />
          </div>

          <div>
            <label>Sale Tax Reg #</label>
            <input type="text" name="sales_tax" id="sales_tax" />
          </div>

          <div style="grid-column: span 2">
            <label>Address</label>
            <textarea name="address" id="address"></textarea>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Qty</th>
              <th>T.Price</th>
              <th>Disc %</th>
              <th>Batch</th>
              <th>Expiry</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="items"></tbody>
        </table>

        <button type="button" class="btn add-btn" onclick="addRow()">
          + Add Row
        </button>

        <button type="submit" class="btn generate-btn">Generate PDF</button>
      </form>
    </div>

    <script>
      /* ---------------- CUSTOMER AUTO FILL ---------------- */
      const LAST_INVOICE_URL = "{% url 'customer_last_invoice' 0 %}";

      function fillCustomer() {
        let sel = document.getElementById("customerDropdown");
        let opt = sel.options[sel.selectedIndex];

        let note = document.getElementById("prefill-note");
        note.textContent = "";

        if (!opt.value) return;

        document.getElementById("customer_name").value = opt.dataset.name || "";
        document.getElementById("ntn").value = opt.dataset.ntn || "";
        document.getElementById("sales_tax").value = opt.dataset.sale || "";
        document.getElementById("address").value = opt.dataset.address || "";
        document.getElementById("license_no").value = opt.dataset.license || "";

        loadLastInvoice(opt.value, note);
      }

      /* Pull the customer's previous order so a repeat invoice needs no retyping */
      function loadLastInvoice(customerId, note) {
        note.textContent = "Loading previous invoice...";

        fetch(LAST_INVOICE_URL.replace("/0/", "/" + customerId + "/"), {
          headers: { "X-Requested-With": "XMLHttpRequest" },
        })
          .then(function (response) {
            if (!response.ok) throw new Error(response.status);
            return response.json();
          })
          .then(function (data) {
            /* The saved customer record is newer than the dropdown's snapshot */
            document.getElementById("ntn").value = data.ntn;
            document.getElementById("sales_tax").value = data.sales_tax;
            document.getElementById("address").value = data.address;
            document.getElementById("license_no").value = data.license_no;

            let tbody = document.getElementById("items");
            tbody.innerHTML = "";

            if (!data.items.length) {
              addRow();
              note.textContent = "No previous invoice for this customer.";
              return;
            }

            data.items.forEach(function (item) {
              addRow(item);
            });

            note.textContent =
              "Items prefilled from invoice " +
              data.last_invoice_no +
              " - edit or remove any row.";
          })
          .catch(function () {
            note.textContent = "Could not load the previous invoice.";
          });
      }

      /* ---------------- ITEMS ---------------- */
      function addRow(item) {
        let tr = document.createElement("tr");

        tr.innerHTML = `
        <td><input name="item_name[]" required></td>
        <td><input name="qty[]" type="number" value="1" oninput="calculate(this)"></td>
        <td><input name="price[]" type="number" value="0" oninput="calculate(this)"></td>
        <td><input name="discount[]" type="number" value="0" oninput="calculate(this)"></td>
        <td><input name="batch[]" placeholder="Batch"></td>
        <td><input name="expiry[]" type="text"></td>
        <td><input name="amount[]" readonly></td>
        <td><button type="button" class="delete-btn" onclick="this.parentElement.parentElement.remove()">X</button></td>
    `;

        document.getElementById("items").appendChild(tr);

        if (!item) return;

        /* Assigned as values, never as markup, so item names can't inject HTML */
        tr.querySelector('[name="item_name[]"]').value = item.name;
        tr.querySelector('[name="qty[]"]').value = item.qty;
        tr.querySelector('[name="price[]"]').value = item.price;
        tr.querySelector('[name="discount[]"]').value = item.discount;
        tr.querySelector('[name="batch[]"]').value = item.batch;
        tr.querySelector('[name="expiry[]"]').value = item.expiry;

        calculate(tr.querySelector('[name="qty[]"]'));
      }

      function calculate(el) {
        let row = el.parentElement.parentElement;

        let qty = parseFloat(row.querySelector('[name="qty[]"]').value) || 0;
        let price =
          parseFloat(row.querySelector('[name="price[]"]').value) || 0;
        let disc =
          parseFloat(row.querySelector('[name="discount[]"]').value) || 0;

        let discounted = price - (price * disc) / 100;
        let amount = qty * discounted;

        row.querySelector('[name="amount[]"]').value = amount.toFixed(2);
      }

      /* ---------------- TIMER TO DISMISS NOTIFICATION AUTO ---------------- */
      window.onload = function () {
        addRow();

        // Agar koi alert warning screen par ho to usay 4 seconds baad auto close kar do
        let alertBox = document.getElementById("django-custom-messages");
        if (alertBox) {
          setTimeout(function () {
            alertBox.style.transition = "opacity 0.5s ease";
            alertBox.style.opacity = "0";
            setTimeout(function () {
              alertBox.remove();
            }, 500);
          }, 4000); // 4000ms = 4 seconds
        }
      };
    </script>
  </body>
</html>
