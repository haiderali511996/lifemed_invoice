<!DOCTYPE html>
<html>
  <head>
    <title>Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      body {
        background: linear-gradient(135deg, #1e3c72, #2a5298, #6a11cb);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-card {
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
        border-radius: 16px;
        padding: 40px;
        width: 380px;
      }

      input {
        background: rgba(255, 255, 255, 0.9) !important;
        border: none !important;
        padding: 12px !important;
        border-radius: 8px !important;
      }

      input:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(0, 255, 255, 0.3);
      }

      .btn-login {
        background: linear-gradient(90deg, #00c6ff, #0072ff);
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-weight: bold;
        color: white;
        transition: 0.3s;
      }

      .btn-login:hover {
        transform: scale(1.03);
        box-shadow: 0 8px 20px rgba(0, 198, 255, 0.4);
      }

      h2 {
        color: white;
        text-align: center;
        margin-bottom: 25px;
        font-weight: 700;
      }

      label {
        color: #ddd;
        font-size: 14px;
      }

      .eye {
        position: absolute;
        right: 12px;
        top: 38px;
        cursor: pointer;
        color: #555;
      }

      .input-wrapper {
        position: relative;
      }

      .strength {
        font-size: 12px;
        margin-top: 5px;
      }
    </style>
  </head>

  <body>
    <div class="login-card">
      <h2>🔐 Login Page</h2>

      {% if error %}
      <div class="alert alert-danger text-center py-2">{{ error }}</div>
      {% endif %}

      <form method="POST" onsubmit="return validateForm()">
        {% csrf_token %}

        <!-- Username -->
        <div class="mb-3">
          <label>Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            placeholder="Enter username"
          />
          <small id="userMsg" class="text-warning"></small>
        </div>

        <!-- Password -->
        <div class="mb-3 input-wrapper">
          <label>Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Enter password"
          />

          <span class="eye" onclick="togglePassword()">👁️</span>

          <div id="strength" class="strength text-info"></div>
        </div>

        <button type="submit" class="btn-login w-100">Login</button>
      </form>
    </div>

    <script>
      // Show / Hide Password
      function togglePassword() {
        let pass = document.getElementById("password");
        pass.type = pass.type === "password" ? "text" : "password";
      }

      // Validation
      function validateForm() {
        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;

        let userMsg = document.getElementById("userMsg");

        userMsg.innerText = "";

        {% comment %} if (!/^(?=.*[a-zA-Z])(?=.*\d)(?=.*_)[a-zA-Z0-9_]{4,}$/.test(username)) {
          userMsg.innerText =
            "Username must be 4+ chars with letters, digits and '_' (e.g. user_1)";
          return false;
        } {% endcomment %}

        if (
          !/^(?=.*[a-zA-Z])(?=.*\d)(?=.*[!@#$%^&*()_\-+=])[A-Za-z\d!@#$%^&*()_\-+=]{8,}$/.test(
            password
          )
        ) {
          alert(
            "Password must be 8+ chars with letter, number & special character"
          );
          return false;
        }

        return true;
      }

      // Password Strength Checker
      document
        .getElementById("password")
        .addEventListener("input", function () {
          let val = this.value;
          let strength = document.getElementById("strength");

          if (val.length < 4) {
            strength.innerText = "Weak 🔴";
            strength.style.color = "red";
          } else if (val.length < 8) {
            strength.innerText = "Medium 🟠";
            strength.style.color = "orange";
          } else {
            strength.innerText = "Strong 🟢";
            strength.style.color = "lightgreen";
          }
        });
    </script>
  </body>
</html>
